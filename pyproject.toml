[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mutmut-win"
version = "2.17.0"
description = "Windows-native mutation testing for Python, based on mutmut 3.5.0"
readme = "README.md"
license = "ISC"
requires-python = ">=3.12"
authors = [
    { name = "pgm1980" },
]
keywords = ["mutation-testing", "testing", "windows"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: ISC License (ISCL)",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "click>=8.0.0",
    "coverage>=7.3.0",
    "libcst>=1.8.5",
    "psutil>=5.9",
    "pydantic>=2.0.0",
    # >=8.2: the worker passes per-mutant tests via pytest's @argfile syntax
    # ("Added in version 8.2"); with older pytest every covered mutant became
    # "suspicious" (issue #125 / 360 analysis A2). Pinned against
    # constants.MINIMUM_PYTEST_VERSION by a test.
    "pytest>=8.2",
    "setproctitle>=1.1.0",
    "textual>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.1",
    "pytest-asyncio>=0.25",
    "pytest-mock>=3.14",
    "pytest-benchmark>=5.1",
    "hypothesis>=6.119",
    "import-linter>=2.1",
    # mutmut-win is this project itself — no external mutation testing dependency needed.
    # To run mutation testing: uv run mutmut-win run --paths-to-mutate src/mutmut_win/
    "mypy>=1.13",
    "ruff>=0.8",
    "pip-audit>=2.7",
]

[project.scripts]
mutmut-win = "mutmut_win.cli:cli"

[tool.mutmut]
paths_to_mutate = ["src/mutmut_win/"]
tests_dir = ["tests/unit/"]

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = [
    # Reference fixture projects copied from mutmut 3.5.0 — not subject to our lint rules.
    "tests/e2e_projects",
    # Tooling sandbox (hook scripts etc.) — not project code; without this
    # exclude a bare `ruff check .` reported findings the gates never saw
    # (issue #132 / 360°-B13).
    ".claude",
    # Rescued external acceptance harness for the nextgen-operator roadmap —
    # a standalone TDD fixture project (own venv / uv.lock), not subject to our
    # lint rules; same rationale as tests/e2e_projects.
    "_docs/nextgen_roadmap",
]

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "N",
    "UP",
    "S",
    "B",
    "A",
    "C4",
    "DTZ",
    "T10",
    "ISC",
    "ICN",
    "PIE",
    "PT",
    "RET",
    "SIM",
    "TCH",
    "ARG",
    "PTH",
    "ERA",
    "PERF",
    "RUF",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
"benchmarks/**" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_generics = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.pytest.ini_options]
markers = [
    "slow: long-running tests",
    "integration: integration tests",
]
testpaths = ["tests"]
python_functions = ["test_*"]

[tool.importlinter]
root_packages = ["mutmut_win"]

# Five-band layered architecture; ':' marks siblings that intentionally
# collaborate. Rationale + what stays forbidden:
# _docs/architecture spec/adr_layer_contracts_v2.md (issue #84).
[[tool.importlinter.contracts]]
name = "Layer architecture (ADR layer contracts v2)"
type = "layers"
layers = [
    "mutmut_win.cli : mutmut_win.browser",
    "mutmut_win.orchestrator : mutmut_win.runner : mutmut_win.stats : mutmut_win.mutant_diff",
    "mutmut_win.file_setup : mutmut_win.mutation : mutmut_win.node_mutation : mutmut_win.regex_mutation : mutmut_win.trampoline : mutmut_win.test_mapping : mutmut_win.db : mutmut_win.type_checking : mutmut_win.type_checker_filter : mutmut_win.code_coverage",
    "mutmut_win.process",
    "mutmut_win.config : mutmut_win.models : mutmut_win.constants : mutmut_win.exceptions : mutmut_win._state : mutmut_win.hit_recording",
]
